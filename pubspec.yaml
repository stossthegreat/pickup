name: charmr
description: "Charmr — roleplay your way to real confidence."
publish_to: 'none'
version: 1.0.0+202

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.3
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  camera: 0.10.5+5
  google_mlkit_face_detection: ^0.13.0
  # Android-only — Google explicitly states this plugin's iOS impl is
  # "still in beta and only available for Android". On iOS we synthesise
  # an equivalent dense overlay from face contours via _buildSemanticMesh
  # in scan_screen.dart, populating canonical MediaPipe indices from ML
  # Kit contour data. No third-party iOS face-mesh dependency.
  google_mlkit_face_mesh_detection: ^0.4.2
  # Google ML Kit text recognition — free, on-device OCR. Powers the
  # RIZZ tab's screenshot → 3 replies flow: user drops a Hinge / Tinder
  # screenshot, ML Kit extracts the text, the backend rewrites it as
  # three options. Zero network cost for the OCR step, no GPT vision
  # tokens burned on UI chrome.
  #
  # Pinned to 0.15.1 because that's the version sitting on
  # google_mlkit_commons ^0.11.x — the same commons family
  # google_mlkit_face_mesh_detection 0.4.2 requires. Older 0.11/0.13
  # text-recognition releases pulled commons ^0.6.x / ^0.10.x and the
  # solver couldn't pick a single commons that satisfied both. 0.15.1
  # is what `flutter pub get` itself recommended.
  google_mlkit_text_recognition: ^0.15.1
  # image_picker — opens the system gallery or camera to grab a
  # screenshot for the RIZZ tab. Photo bytes are handed straight to
  # ML Kit on-device OCR; nothing leaves the device until the user
  # taps GENERATE.
  image_picker: ^1.1.2
  provider: ^6.1.2
  http: ^1.2.0
  image: ^4.2.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  share_plus: ^10.0.2
  # RevenueCat SDK — single integration for App Store + Play Billing.
  # Handles subscriptions, one-time IAPs, receipt validation, and
  # restore-purchases. We use it for Mirrorly Pro (monthly/annual) and
  # the 20-credit one-time pack.
  #
  # PINNED TO 10.x FOR GOOGLE PLAY BILLING 8. We were on ^8.2.2, which
  # resolved to 8.11.0 — Play Billing Library 7. Google stops accepting
  # NEW UPLOADS built on Billing 7 after 31 Aug 2026, so 8.11.0 was a
  # hard wall on shipping any further Android update, regardless of the
  # fact that billing itself worked fine on it.
  #
  #   purchases_flutter  9.0.0  → Billing Library 8.0
  #   purchases_flutter 10.0.0  → Billing Library 8.3, Android minSdk 23
  #
  # 10.x is the one to be on: 9.x is already a version behind Google's
  # library and we'd be doing this again. Requirements all satisfied
  # already — Dart >=3.4 (we're on 3.8), Flutter >=3.22, iOS 13 (we're
  # on 15.5), Android minSdk 23 (app/build.gradle.kts already 23).
  #
  # The only source change the upgrade needed: 9.0.0 changed the return
  # of Purchases.purchasePackage() from CustomerInfo to PurchaseResult
  # (CustomerInfo + StoreTransaction). One call site, in
  # purchase_service.dart. Everything else we touch — configure,
  # setLogLevel, getOfferings, getCustomerInfo, restorePurchases,
  # addCustomerInfoUpdateListener, PurchasesErrorHelper and every
  # PurchasesErrorCode we switch on — is unchanged in 10.8.0.
  #
  # NOTE for the RevenueCat dashboard: from 10.0.0 a one-time product
  # configured as CONSUMABLE can no longer be restored (Billing 8 removed
  # the query for consumed purchases). `mirrorly_pro_rescue` is a credit
  # grant, so consumable is correct for it — but any product meant to be
  # a lifetime unlock must be set to NON-consumable.
  purchases_flutter: ^10.8.0
  # Firebase Analytics — conversion-funnel telemetry only. Logs the
  # named events in lib/services/analytics_service.dart. No PII, no
  # advertising IDs, no user properties beyond an anonymous app
  # install ID. The Firebase config files (GoogleService-Info.plist
  # for iOS, google-services.json for Android) are dropped in by the
  # native side; the Flutter side just calls the SDK.
  firebase_core:      ^3.6.0
  firebase_analytics: ^11.3.3
  # Local notifications — the retention engine. Daily 8pm "log today"
  # streak nudge, rescan reminders at day 14 / 30, milestone celebrations.
  # Zero server dependency; scheduled on-device via the plugin. `timezone`
  # is required to schedule at a specific local-wall-clock time rather
  # than UTC.
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # ── AURALAY GRAFT (Eyes + Game tabs + voice AI) ─────────────────────────
  # Auralay imported its full charisma-training stack into Mirrorly:
  # gaze lessons (Eyes tab), Lucien voice roleplay (Game tab), shared
  # progress in the Progress tab.
  smooth_page_indicator: ^1.2.0+3
  # Mic recording for charisma drills + realtime voice. Pinned the same
  # way Auralay pinned camera 0.10.5+5 — moving versions breaks iOS.
  record: ^5.2.1
  # Played-back TTS clips from /v1/diablo/speak + /v1/villain/* /scene/turn.
  audioplayers: ^6.1.0
  # Low-latency PCM playback for OpenAI Realtime API audio deltas (the
  # Game tab Free Flow + Council voice surfaces stream PCM, not MP3).
  flutter_pcm_sound: ^3.0.0
  # WebSocket transport for the OpenAI Realtime API. Dart-only, no native.
  web_socket_channel: ^3.0.1
  # Keeps the screen on during eye-contact drills + voice sessions.
  wakelock_plus: ^1.2.1
  # Secure storage for the creator/diablo unlock flags (mirrors Auralay).
  flutter_secure_storage: ^9.2.4
  # ── BACKEND (Supabase) — identity, squads, ELO, leaderboards ─────────
  # supabase_flutter carries auth (anonymous + Sign in with Apple via
  # id-token), Postgres REST reads guarded by RLS, and Realtime streams
  # (squad notifications). The publishable key it uses is safe to ship —
  # every table is locked down by row-level security server-side.
  supabase_flutter: ^2.8.0
  # Native Apple credential for the Supabase id-token sign-in flow.
  sign_in_with_apple: ^6.1.3
  # Native Google credential for the same id-token flow (v6 API —
  # v7 reworked the surface; pin until we migrate deliberately).
  google_sign_in: ^6.2.1
  # sha256 of the raw nonce passed to Apple (replay protection).
  crypto: ^3.0.3

  # In-app review prompt. Tracks 3 milestones (first scan, first Free
  # Flow, first eye-contact lesson) — when all three are done, the
  # review dialog fires once asking for stars + comments. On 4-5 stars
  # we open the App Store / Play Store write-review page; on 1-3 stars
  # we keep the feedback in-app so reviewers can flag the negatives
  # before they hit the public store.
  in_app_review: ^2.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

# record 5.2.1 transitively pulls record_linux 0.7.2, which doesn't
# implement `startStream` — a method added in record_platform_interface
# 1.5.0 (which 5.2.1 also accepts). The Dart frontend compiles every
# referenced library regardless of target platform, so the iOS archive
# build fails in record_linux.dart with "missing implementations".
# Pinning record_linux to 1.x picks up the implementation matching the
# modern interface. iOS only links record_darwin, so this has zero
# runtime impact on iOS/Android — it just lets kernel_snapshot succeed.
# (Lifted verbatim from Auralay where this same fix was shipped.)
dependency_overrides:
  record_linux: ^1.0.0

flutter:
  # ── SWIFT PACKAGE MANAGER: OFF ──────────────────────────────────────
  #
  # WHY IT MUST BE OFF. This is a CocoaPods project — Runner.xcodeproj
  # contains zero SPM references and every dependency is a pod. SPM only
  # appears because Flutter injects it when the build machine has the
  # feature on, and it then drags in the whole firebase-ios-sdk package
  # graph, including a gRPC BINARY artifact CocoaPods never needed (gRPC
  # belongs to Firestore; this app only uses Analytics). That artifact
  # failing to unpack is what killed b172.
  #
  # WHY IT LIVES HERE. Machine-level `flutter config` writes to
  # ~/.config/flutter/settings, so it has to be remembered for every
  # runner and every fresh CI image and is silently absent the one time
  # somebody forgets. This key travels with the code.
  #
  # DO NOT PUT IT IN CODEMAGIC'S BUILD-ARGUMENTS FIELD. That field is
  # concatenated onto `flutter build ipa ...`, so a `flutter config`
  # command pasted there becomes an unknown flag and fails the build
  # outright ("Could not find an option named
  # --no-enable-swift-package-manager"). With this key set, that field
  # must contain ONLY the plain build args.
  #
  # NOTE THE SHAPE — this is what b179 fixes. b177 set it as a
  # top-level `disable-swift-package-manager: true`, which is the OLD
  # spelling. Current Flutter does not ignore it: `pub get` refuses to
  # run at all with "the configuration has moved", so the build died
  # before a single line was compiled. It is a nested `config:` block
  # now.
  config:
    enable-swift-package-manager: false

  uses-material-design: true
  assets:
    - assets/icons/appstore.png
    - assets/icons/playstore.png
    # Mirror-tab pre-scan before/after pair. Declared as a directory
    # so the build doesn't fail when the JPEGs haven't been dropped
    # yet — Flutter bundles whatever exists in the folder, and the
    # Image.asset errorBuilder in _BeforeAfterTile falls back to a
    # placeholder face icon when a specific file is missing. Drop
    # two JPEGs (before.jpg + after.jpg, 4:5 portrait, same face)
    # per assets/marketing/README.md and they auto-bundle on next
    # build — no pubspec edit needed.
    - assets/marketing/
    # Onboarding intro-reel visuals (screens 4-7). Declared as a
    # directory so the build never breaks before the JPEGs land; the
    # reel's Image.asset errorBuilder shows a clean placeholder until
    # then. Drop looks/game/messages/future.jpg per
    # assets/onboarding/README.md — they auto-bundle on next build.
    - assets/onboarding/
    # Character renders — Lucien + roleplay women + gaze partners +
    # free-flow hero + scan split. Declared as directories so the
    # build never breaks before the JPEGs land. Every tab uses
    # Image.asset with an errorBuilder that falls back to a glyph,
    # so missing files render gracefully. See the README.md inside
    # each folder for the exact filenames and art-direction brief.
    # Sound cues for the reveal + reel. Declared as a directory so the
    # build never breaks before the files land; every Sfx call is a
    # logged no-op until then. See assets/sfx/README.md for the ten
    # files and the mixing brief.
    - assets/sfx/
    - assets/characters/lucien/
    - assets/characters/women/
    - assets/game/

# Generates every iOS + Android launcher icon from two master PNGs.
# Run after dropping new masters:  dart run flutter_launcher_icons
#
# Adaptive icons (Android 8+): without these fields, modern Android shrinks
# the legacy square ic_launcher into the adaptive-icon safe zone and wraps
# it with a fat generated background — the result is a small floating icon
# with a thick outer ring. Fix: feed playstore.png to BOTH the legacy
# slot AND the adaptive foreground layer, with a solid black background
# that matches the artwork. The mesh now fills the visible mask instead
# of getting insetted into a 66%-scale sandbox.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path_ios:           "assets/icons/appstore.png"
  image_path_android:       "assets/icons/playstore.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icons/playstore.png"
  remove_alpha_ios: true
  min_sdk_android: 23
